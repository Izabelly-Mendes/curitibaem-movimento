<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="diferencial_logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curitiba em Movimento">
<title>Curitiba em Movimento · Bicalho Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cor-principal: #FF6B00;
  --cor-fundo: #f5f5f0;
  --cor-header: #1a1a1a;
  --fonte-titulo: 'Syne', sans-serif;
  --fonte-corpo: 'DM Sans', sans-serif;
  --font-size: 14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fonte-corpo);background:var(--cor-fundo);color:#1a1a1a;font-size:var(--font-size);line-height:1.6}

/* ── HEADER ── */
.header{background:var(--cor-header);padding:0 24px;position:sticky;top:0;z-index:100;border-bottom:0.5px solid rgba(255,255,255,0.07)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.header-logo{height:30px;filter:brightness(0) invert(1)}
.header-right{display:flex;align-items:center;gap:8px}
.lang-btn{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.7);transition:all 0.15s;line-height:1.4}
.lang-btn:hover{background:rgba(255,255,255,0.16)}
.lang-btn.active{background:rgba(255,107,0,0.2);border-color:rgba(255,107,0,0.4);color:#FF6B00}

/* ── CONTAINER ── */
.container{max-width:1100px;margin:0 auto;padding:40px 24px 72px}

/* ── SECTION LABEL ── */
.sec-label{font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--cor-principal);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:0.5px;background:#ddd}

/* ── BLOCOS ── */
.blocos-grid{display:grid;gap:14px}

.bloco-card{background:#fff;border-radius:14px;border:0.5px solid #e0ddd5;padding:22px 24px}
.bloco-card.tipo-insight{background:#1a1a1a;border-color:#1a1a1a}
.bloco-card.tipo-insight-box{background:rgba(255,107,0,0.06);border-left:3px solid var(--cor-principal);border-top:none;border-right:none;border-bottom:none;border-radius:0 8px 8px 0}

.bloco-tipo-badge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--cor-principal);margin-bottom:6px}
.bloco-titulo{font-family:var(--fonte-titulo);font-size:15px;font-weight:700;margin-bottom:8px;color:#1a1a1a}
.bloco-card.tipo-insight .bloco-titulo{color:#fff}
.bloco-conteudo{font-size:13.5px;color:#555;line-height:1.72}
.bloco-card.tipo-insight .bloco-conteudo{color:rgba(255,255,255,0.6)}
.bloco-conteudo strong{color:#1a1a1a}
.bloco-card.tipo-insight .bloco-conteudo strong{color:#fff}

/* ── LOADING ── */
.loading{text-align:center;padding:80px 20px;color:#bbb}
.spinner{width:32px;height:32px;border:3px solid #f0ede6;border-top-color:var(--cor-principal);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ERRO ── */
.error-state{text-align:center;padding:60px 20px;color:#e74c3c}
.error-state .ico{font-size:48px;margin-bottom:12px}
.error-state p{font-size:14px;margin-bottom:16px}
.retry-btn{display:inline-block;background:#f5f5f0;border:0.5px solid #ddd;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:var(--fonte-corpo);color:#555}
.retry-btn:hover{background:#eee}

/* ── FOOTER ── */
.footer{background:#1a1a1a;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-txt{font-size:11px;color:rgba(255,255,255,0.3)}
.footer-logo{height:26px;filter:brightness(0) invert(1);opacity:0.3}

/* ── MOBILE ── */
@media(max-width:640px){
  .container{padding:28px 16px 56px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <img src="diferencial_logo.png" class="header-logo" alt="Diferencial" onerror="this.style.display='none'">
    <div class="header-right">
      <button class="lang-btn active" onclick="setLang('pt')" id="btn-pt">🇧🇷 PT</button>
      <button class="lang-btn" onclick="setLang('en')" id="btn-en">🇺🇸 EN</button>
      <button class="lang-btn" onclick="setLang('zh')" id="btn-zh">🇨🇳 ZH</button>
    </div>
  </div>
</header>

<div id="main-content" class="container">
  <div class="sec-label" id="sec-label-cwr">Curitiba em Movimento</div>
  <div class="blocos-grid" id="blocos-grid">
    <div class="loading"><div class="spinner"></div><p id="loading-txt">Carregando conteúdo...</p></div>
  </div>
</div>

<footer class="footer">
  <span class="footer-txt" id="footer-txt">Curitiba em Movimento · Bicalho Imóveis × Diferencial</span>
  <img src="diferencial_logo.png" class="footer-logo" alt="Diferencial" onerror="this.style.display='none'">
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ══════════════════════════════════════════════════════════
// CONFIG — anon key pública por design do Supabase
// Variáveis de ambiente no painel Vercel → Settings → Env Vars:
//   SUPABASE_URL, SUPABASE_ANON_KEY
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://uocnikcoynoflxgcknii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nWEHxISod-7kWfXptMj6Ow_RQU6hsf2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── I18N ──
const i18n = {
  pt: {
    sec_cwr: 'Curitiba em Movimento',
    footer: 'Curitiba em Movimento · Bicalho Imóveis × Diferencial',
    loading: 'Carregando conteúdo...',
    vazio: 'Nenhum conteúdo disponível no momento.',
    erro: 'Erro ao carregar o conteúdo.',
    tentar: 'Tentar novamente'
  },
  en: {
    sec_cwr: 'Curitiba in Motion',
    footer: 'Curitiba in Motion · Bicalho Properties × Diferencial',
    loading: 'Loading content...',
    vazio: 'No content available at this time.',
    erro: 'Error loading content.',
    tentar: 'Try again'
  },
  zh: {
    sec_cwr: '库里提巴动态',
    footer: '库里提巴动态 · Bicalho 房产 × Diferencial',
    loading: '加载中...',
    vazio: '暂无可用内容。',
    erro: '加载内容时出错。',
    tentar: '重试'
  }
};

let lang = localStorage.getItem('portal-lang') || 'pt';

function setLang(l) {
  lang = l;
  localStorage.setItem('portal-lang', l);
  document.getElementById('btn-pt').classList.toggle('active', l === 'pt');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-zh').classList.toggle('active', l === 'zh');
  document.getElementById('sec-label-cwr').textContent = i18n[l].sec_cwr;
  document.getElementById('footer-txt').textContent = i18n[l].footer;
  document.title = i18n[l].sec_cwr + ' · Bicalho Imóveis';
}

// ── INIT ──
async function init() {
  setLang(lang);

  // Aplica config visual do Supabase
  try {
    const { data: cfg } = await sb.from('config_visual').select('*').limit(1).single();
    if (cfg) applyConfig(cfg);
  } catch (_) { /* usa defaults */ }

  // Carrega blocos
  await loadBlocos();
}

function applyConfig(cfg) {
  const r = document.documentElement;
  if (cfg.cor_principal) r.style.setProperty('--cor-principal', cfg.cor_principal);
  if (cfg.cor_fundo)     r.style.setProperty('--cor-fundo', cfg.cor_fundo);
  if (cfg.cor_header)    r.style.setProperty('--cor-header', cfg.cor_header);
  if (cfg.fonte_titulo)  r.style.setProperty('--fonte-titulo', `'${cfg.fonte_titulo}', sans-serif`);
  if (cfg.fonte_corpo)   r.style.setProperty('--fonte-corpo', `'${cfg.fonte_corpo}', sans-serif`);
  if (cfg.tamanho_fonte) r.style.setProperty('--font-size', cfg.tamanho_fonte + 'px');
}

async function loadBlocos() {
  const el = document.getElementById('blocos-grid');
  try {
    const { data, error } = await sb
      .from('blocos_conteudo')
      .select('*')
      .eq('visivel_cliente', true)
      .order('ordem');
    if (error) throw error;
    renderBlocos(data || []);
  } catch (err) {
    const t = i18n[lang];
    el.innerHTML = `
      <div class="error-state">
        <div class="ico">⚠️</div>
        <p>${t.erro}<br><small style="color:#aaa;font-size:12px">${err.message}</small></p>
        <button class="retry-btn" onclick="loadBlocos()">${t.tentar}</button>
      </div>`;
  }
}

function renderBlocos(blocos) {
  const el = document.getElementById('blocos-grid');
  const t = i18n[lang];
  if (!blocos.length) {
    el.innerHTML = `<p style="color:#aaa;font-size:13.5px;text-align:center;padding:60px 0">${t.vazio}</p>`;
    return;
  }
  el.innerHTML = blocos.map(b => {
    const tipoClass = b.tipo === 'insight' ? 'tipo-insight' : '';
    return `
      <div class="bloco-card ${tipoClass}">
        <div class="bloco-tipo-badge">${b.tipo || 'card'}</div>
        ${b.titulo ? `<div class="bloco-titulo">${esc(b.titulo)}</div>` : ''}
        <div class="bloco-conteudo">${b.conteudo || ''}</div>
      </div>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="diferencial_logo.png">
<title>Meu Perfil — Curitiba em Movimento</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--color-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--color-card);border:1px solid var(--color-border);box-shadow:var(--shadow-card);border-radius:var(--radius-card);padding:40px 36px;width:100%;max-width:400px;margin:0 auto}
.logo-wrap{text-align:center;margin-bottom:24px}
.logo-wrap img{height:40px}
.nome-corretor{font-family:var(--font-heading);font-size:18px;font-weight:700;color:var(--color-text);text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--color-text-secondary);text-align:center;margin-bottom:28px}
.field-label{font-size:12px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;display:block}
.field-wrap{position:relative;margin-bottom:16px}
.field-input{width:100%;border:1px solid var(--color-border);border-radius:10px;padding:12px 14px;padding-right:42px;font-family:var(--font-body);font-size:14px;color:var(--color-text);outline:none;transition:border-color 0.2s;background:#fafafa}
.field-input:focus{border-color:var(--color-primary);background:#fff}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:16px;padding:4px;line-height:1}
.eye-btn:hover{color:var(--color-text)}
.btn-salvar{width:100%;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-btn);height:48px;padding:0 13px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn-salvar:hover{background:var(--color-primary-hover)}
.btn-salvar:disabled{background:#ccc;cursor:not-allowed}
.erro-msg{background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#c0392b;margin-bottom:16px;display:none}
.ok-msg{background:rgba(39,174,96,0.08);border:1px solid rgba(39,174,96,0.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#219a52;margin-bottom:16px;display:none}
.back-link{text-align:center;margin-top:18px}
.back-link a{font-size:12px;color:var(--color-text-secondary);text-decoration:none}
.back-link a:hover{color:var(--color-primary)}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="diferencial_logo.png" alt="Diferencial Imóveis">
  </div>
  <div class="nome-corretor" id="nome-corretor">—</div>
  <div class="sub">Alterar senha de acesso</div>

  <div class="erro-msg" id="erro-msg"></div>
  <div class="ok-msg" id="ok-msg"></div>

  <label class="field-label" for="senha-atual">Senha atual</label>
  <div class="field-wrap">
    <input type="password" id="senha-atual" class="field-input" placeholder="••••••••" autocomplete="current-password">
    <button class="eye-btn" type="button" onclick="toggleVer('senha-atual',this)">👁</button>
  </div>

  <label class="field-label" for="senha-nova">Nova senha</label>
  <div class="field-wrap">
    <input type="password" id="senha-nova" class="field-input" placeholder="mínimo 6 caracteres" autocomplete="new-password">
    <button class="eye-btn" type="button" onclick="toggleVer('senha-nova',this)">👁</button>
  </div>

  <label class="field-label" for="senha-confirm">Confirmar nova senha</label>
  <div class="field-wrap">
    <input type="password" id="senha-confirm" class="field-input" placeholder="••••••••" autocomplete="new-password" onkeydown="if(event.key==='Enter')trocarSenha()">
    <button class="eye-btn" type="button" onclick="toggleVer('senha-confirm',this)">👁</button>
  </div>

  <div id="erro-perfil" style="color:#e24b4a;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px;"></div>
  <div id="sucesso-perfil" style="color:#3b6d11;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px;"></div>
  <button class="btn-salvar" onclick="trocarSenha()">Salvar nova senha</button>

  <div class="back-link">
    <a href="./index.html">← Voltar ao material</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  'https://uocnikcoynoflxgcknii.supabase.co',
  'sb_publishable_nWEHxISod-7kWfXptMj6Ow_RQU6hsf2'
);

async function hashSenha(senha) {
  const encoder = new TextEncoder();
  const data = encoder.encode(senha);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function toggleVer(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

async function trocarSenha() {
  const senhaAtual = document.getElementById('senha-atual').value;
  const senhaNova = document.getElementById('senha-nova').value;
  const senhaConfirm = document.getElementById('senha-confirm').value;
  const erroEl = document.getElementById('erro-perfil');
  const sucessoEl = document.getElementById('sucesso-perfil');

  if (erroEl) erroEl.textContent = '';
  if (sucessoEl) sucessoEl.textContent = '';

  if (!senhaAtual || !senhaNova || !senhaConfirm) {
    if (erroEl) erroEl.textContent = 'Preencha todos os campos.';
    return;
  }

  if (senhaNova !== senhaConfirm) {
    if (erroEl) erroEl.textContent = 'As senhas novas não coincidem.';
    return;
  }

  if (senhaNova.length < 6) {
    if (erroEl) erroEl.textContent = 'A nova senha deve ter pelo menos 6 caracteres.';
    return;
  }

  const btn = document.querySelector('button[onclick="trocarSenha()"]');
  if (btn) { btn.textContent = 'Salvando...'; btn.disabled = true; }

  try {
    const sessaoStr = sessionStorage.getItem('sessao_corretor');
    if (!sessaoStr) { window.location.href = './login.html'; return; }
    const sessao = JSON.parse(sessaoStr);

    const hashAtual = await hashSenha(senhaAtual);

    const { data, error } = await supabaseClient
      .from('corretores')
      .select('id')
      .eq('id', sessao.corretor_id)
      .eq('senha_hash', hashAtual)
      .maybeSingle();

    if (error || !data) {
      if (erroEl) erroEl.textContent = 'Senha atual incorreta.';
      if (btn) { btn.textContent = 'Salvar nova senha'; btn.disabled = false; }
      return;
    }

    const hashNova = await hashSenha(senhaNova);

    await supabaseClient
      .from('corretores')
      .update({ senha_hash: hashNova, atualizado_em: new Date().toISOString() })
      .eq('id', sessao.corretor_id);

    if (sucessoEl) sucessoEl.textContent = 'Senha alterada com sucesso!';
    if (btn) { btn.textContent = 'Salvar nova senha'; btn.disabled = false; }

    document.getElementById('senha-atual').value = '';
    document.getElementById('senha-nova').value = '';
    document.getElementById('senha-confirm').value = '';

  } catch(e) {
    console.error('Erro:', e);
    if (erroEl) erroEl.textContent = 'Erro inesperado. Tente novamente.';
    if (btn) { btn.textContent = 'Salvar nova senha'; btn.disabled = false; }
  }
}

window.addEventListener('DOMContentLoaded', function() {
  const isAdmin = sessionStorage.getItem('admin_logado');
  const sessao = JSON.parse(sessionStorage.getItem('sessao_corretor') || '{}');
  if (!isAdmin && !sessao.corretor_id) {
    window.location.href = './login.html';
    return;
  }
  if (sessao.nome) {
    document.getElementById('nome-corretor').textContent = sessao.nome;
  } else if (isAdmin) {
    document.getElementById('nome-corretor').textContent = 'Administrador';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curitiba em Movimento">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAF8">
<title>Acesso — Curitiba em Movimento</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--color-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--color-card);border:1px solid var(--color-border);box-shadow:var(--shadow-card);border-radius:var(--radius-card);padding:40px 36px;width:100%;max-width:400px;margin:0 auto}
.logo-wrap{text-align:center;margin-bottom:28px}
.logo-wrap img{height:44px}
.login-title{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--color-text);text-align:center;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--color-text-secondary);text-align:center;margin-bottom:28px}
.field-label{font-size:12px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;display:block}
.field-wrap{position:relative;margin-bottom:16px}
.field-input{width:100%;border:1px solid var(--color-border);border-radius:10px;padding:12px 14px;font-family:var(--font-body);font-size:14px;color:var(--color-text);outline:none;transition:border-color 0.2s;background:#fafafa}
.field-input:focus{border-color:var(--color-primary);background:#fff}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:16px;padding:4px;line-height:1}
.eye-btn:hover{color:var(--color-text)}
.btn-entrar{width:100%;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-btn);height:48px;padding:0 13px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;transition:background 0.2s;margin-top:4px}
.btn-entrar:hover{background:var(--color-primary-hover)}
.btn-entrar:disabled{background:#ccc;cursor:not-allowed}
.erro-msg{background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#c0392b;margin-bottom:16px;display:none}
.forgot-link{text-align:center;margin-top:18px}
.forgot-link a{font-size:12px;color:var(--color-text-secondary);text-decoration:none;cursor:pointer}
.forgot-link a:hover{color:var(--color-primary)}
.forgot-info{font-size:12px;color:var(--color-text-secondary);text-align:center;margin-top:10px;display:none;line-height:1.5}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <img src="diferencial_logo.png" alt="Diferencial Imóveis">
  </div>
  <div class="login-title">Curitiba em Movimento</div>
  <div class="login-sub">Acesso restrito — Equipe Bicalho</div>

  <div class="erro-msg" id="erro-msg"></div>

  <div>
    <label class="field-label" for="email">E-mail</label>
    <div class="field-wrap">
      <input type="email" id="email" class="field-input" placeholder="seu@email.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('senha').focus()">
    </div>

    <label class="field-label" for="senha">Senha</label>
    <div class="field-wrap">
      <input type="password" id="senha" class="field-input" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px" onkeydown="if(event.key==='Enter')fazerLogin()">
      <button class="eye-btn" type="button" onclick="toggleSenha()" id="eye-btn" title="Mostrar/ocultar senha">👁</button>
    </div>

    <div id="erro-login" style="color:#e24b4a;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px;"></div>
    <button class="btn-entrar" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
  </div>

  <div class="forgot-link">
    <a onclick="toggleEsqueci()">Esqueci minha senha</a>
  </div>
  <div class="forgot-info" id="forgot-info">
    <label class="field-label" for="email-recuperar" style="margin-top:10px;display:block">Informe seu e-mail para receber o link de redefinição</label>
    <div class="field-wrap" style="margin-top:6px">
      <input type="email" id="email-recuperar" class="field-input" placeholder="seu@email.com">
    </div>
    <button class="btn-entrar" style="margin-top:4px" onclick="recuperarSenha()">Enviar link de redefinição</button>
    <div id="msg-recuperar" style="font-size:12px;text-align:center;margin-top:10px;min-height:16px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth.js"></script>
<script>
const { createClient } = supabase;
// Login único (Fase 1 / ADR 0001 / Bloco C) — Supabase Auth via auth.js
// Serve tanto corretor quanto gestor: a role é lida de `perfis` depois
// da autenticação, não existe mais fluxo separado de login admin.

function mostrarErro(msg) {
  const el = document.getElementById('erro-login');
  if (el) el.textContent = msg;
  const el2 = document.getElementById('erro-msg');
  if (el2) { el2.textContent = msg; el2.style.display = 'block'; }
}

function toggleSenha() {
  const input = document.getElementById('senha');
  const btn = document.getElementById('eye-btn');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁'; }
}

function toggleEsqueci() {
  const el = document.getElementById('forgot-info');
  el.style.display = el.style.display === 'none' || !el.style.display ? 'block' : 'none';
}

async function recuperarSenha() {
  const email = document.getElementById('email-recuperar').value.trim().toLowerCase();
  const msgEl = document.getElementById('msg-recuperar');
  if (!email) { msgEl.textContent = 'Informe um e-mail.'; msgEl.style.color = '#e24b4a'; return; }
  msgEl.style.color = 'var(--color-text-secondary)';
  msgEl.textContent = 'Enviando...';
  const { error } = await authClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/perfil.html'
  });
  if (error) { msgEl.textContent = 'Erro: ' + error.message; msgEl.style.color = '#e24b4a'; return; }
  msgEl.textContent = 'Se o e-mail existir, um link de redefinição foi enviado.';
  msgEl.style.color = '#3b6d11';
}

async function direcionarPorRole(perfil) {
  // Registra o acesso (nova trilha: perfil_id, nao corretor_id). acesso_id
  // e entrou_em ficam em sessionStorage so como dado AUXILIAR de UX
  // (calcular duracao ao sair) - nunca como prova de autenticacao, que
  // continua sendo inteiramente a sessao do Supabase Auth.
  const entrouEm = new Date().toISOString();
  const { data } = await authClient.from('acessos_corretores')
    .insert({ perfil_id: perfil.id, entrou_em: entrouEm, user_agent: navigator.userAgent.substring(0, 200) })
    .select('id').single();
  if (data) {
    sessionStorage.setItem('acesso_id', data.id);
    sessionStorage.setItem('acesso_entrou_em', entrouEm);
  }

  window.location.href = perfil.role === 'gestor' ? './admin.html' : './index.html';
}

async function fazerLogin() {
  const emailEl = document.getElementById('email');
  const senhaEl = document.getElementById('senha');
  const erroEl = document.getElementById('erro-login');

  const email = emailEl.value.trim().toLowerCase();
  const senha = senhaEl.value;
  if (erroEl) erroEl.textContent = '';

  if (!email || !senha) {
    if (erroEl) erroEl.textContent = 'Preencha email e senha.';
    return;
  }

  const btn = document.getElementById('btn-entrar');
  if (btn) { btn.textContent = 'Entrando...'; btn.disabled = true; }

  try {
    const { data, error } = await authClient.auth.signInWithPassword({ email, password: senha });

    if (error) {
      if (erroEl) erroEl.textContent = 'Email ou senha incorretos.';
      if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }
      return;
    }

    const { data: perfil, error: erroPerfil } = await authClient
      .from('perfis').select('*').eq('id', data.user.id).maybeSingle();

    if (erroPerfil || !perfil) {
      await authClient.auth.signOut();
      if (erroEl) erroEl.textContent = 'Perfil não encontrado. Fale com a administração.';
      if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }
      return;
    }

    if (!perfil.ativo) {
      await authClient.auth.signOut();
      if (erroEl) erroEl.textContent = 'Este acesso está desativado. Fale com a administração.';
      if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }
      return;
    }

    await direcionarPorRole(perfil);

  } catch(e) {
    console.error('Erro inesperado:', e);
    if (erroEl) erroEl.textContent = 'Erro inesperado. Tente novamente.';
    if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }
  }
}

window.addEventListener('DOMContentLoaded', async function() {
  // Ja logado (sessao persistida automaticamente pelo Supabase Auth)?
  const perfil = await getPerfilAtual();
  if (perfil && perfil.ativo) {
    window.location.href = perfil.role === 'gestor' ? './admin.html' : './index.html';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('expirado')) mostrarErro('Sua sessão expirou. Faça login novamente.');
  if (params.get('inativo')) mostrarErro('Este acesso está desativado. Fale com a administração.');
  if (params.get('erro') === 'perfil_nao_encontrado') mostrarErro('Perfil não encontrado. Fale com a administração.');
});
</script>
</body>
</html>
